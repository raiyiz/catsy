[project]
name = "catsy"
version = "0.1.0"
description = "A continuous-variable quantum-optics toolkit built around Gaussian states in phase space."
readme = "README.md"
authors = [
    { name = "gsec", email = "gui@posteo.net" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "qutip>=5.3.1",
    "scipy>=1.16.0,<2.0.0",
]

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "mypy>=2.3,<2.4",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "scipy-stubs>=1.16.0",
]

[tool.mypy]
python_version = "3.13"
files = ["src/catsy"]

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "qutip",
    "qutip.*",
]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
# ruff format also reformats fenced Python code blocks in Markdown by
# default; exclude docs so the README's illustrative formatting (e.g. the
# multi-line builder-pattern example) isn't rewritten on every run.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E4/E7/E9/F: ruff's own default set. I: import sorting (replaces the
# unused `isort` dev dependency). UP: pyupgrade. B: bugbear. RUF: ruff's
# own extra checks.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E741",   # single-letter names like `O`, `V` are the paper's own notation here
    "RUF001", # Greek letters (alpha, theta, ...) are used intentionally in labels/docstrings
    "RUF002",
    "RUF003",
]
