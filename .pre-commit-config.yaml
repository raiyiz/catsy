repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: docs-links-fix
        name: documentation source links
        entry: uv run python scripts/check_doc_links.py --fix
        language: system
        files: '^(README\.md|docs/.*\.typ|src/.*\.py|scripts/check_doc_links\.py)$'
        pass_filenames: false
