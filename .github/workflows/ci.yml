name: CI

on:
  push:
    branches: [main, circuits, pappel, exilas, exilas-complex-example]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run tests
        run: uv run pytest --plot --timings --junitxml=pytest-results.xml --cov=src/catsy --cov-report=term-missing --cov-report=xml:coverage/coverage.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage.xml

  complex-example:
    name: complex example
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run complex example
        run: uv run python examples/complex_example.py
      - name: Upload complex example artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-example
          path: runs/complex_circuit/
          if-no-files-found: error
      - name: Restore Pages history
        if: success() && github.event_name == 'push'
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add _site origin/gh-pages
          else
            git worktree add --orphan gh-pages _site
          fi
      - name: Build Pages report
        if: success() && github.event_name == 'push'
        run: uv run python scripts/build_complex_report.py
      - name: Publish Pages history
        if: success() && github.event_name == 'push'
        run: |
          git -C _site config user.name "github-actions[bot]"
          git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _site add --all
          git -C _site commit -m "ci: publish complex example $GITHUB_SHA" || exit 0
          git -C _site push origin HEAD:gh-pages
      - name: Upload Pages report
        if: success() && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-complex-report:
    name: deploy complex example report
    if: github.event_name == 'push' && (github.ref_name == 'exilas' || github.ref_name == 'exilas-complex-example')
    needs: complex-example
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run ruff check
        run: uv run ruff check .
      - name: Check ruff formatting
        run: uv run ruff format --check .

  docs-links:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check documentation source links
        run: python3 scripts/check_doc_links.py

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Run mypy
        run: uv run mypy
