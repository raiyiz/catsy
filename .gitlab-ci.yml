# Avoid running the pipeline twice for the same commit (once as a branch
# pipeline, once as a merge-request pipeline).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "exilas" && $CI_OPEN_MERGE_REQUESTS == null'

stages:
  - test
  - docs
  - deploy

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
    MPLBACKEND: "Agg"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  interruptible: true

pytest:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - mkdir -p coverage
    # --plot runs the @pytest.mark.visualize tests too. matplotlib is
    # headless here (see MPLBACKEND above), so visualization tests render
    # without opening interactive windows.
    - uv run pytest --plot --timings --junitxml=pytest-results.xml --cov=src/catsy --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/html
  artifacts:
    when: always
    expose_as: "HTML coverage report"
    reports:
      junit: pytest-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/coverage.xml
      - coverage/html/
    expire_in: 1 week
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'

ruff:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - uv run ruff check . --output-format=gitlab --output-file=gl-code-quality-report.json
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week

mypy:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/uv/
    - key: mypy-cache
      paths:
        - .mypy_cache/
  script:
    - uv sync --group dev --locked
    - uv run mypy

docs-links:
  stage: test
  image: python:3.13-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - README.md
        - src/**/*
        - scripts/check_doc_links.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - README.md
        - src/**/*
        - scripts/check_doc_links.py
  script:
    - python3 scripts/check_doc_links.py

typst:
  stage: docs
  image:
    name: ghcr.io/typst/typst:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
  script:
    - apk add --no-cache ttf-liberation ttf-dejavu
    - typst compile
      --input repo-url="${CI_PROJECT_URL}"
      --input commit-sha="${CI_COMMIT_SHA}"
      docs/book.typ architectural_specs.pdf
  artifacts:
    expose_as: "Architectural specs PDF"
    paths:
      - architectural_specs.pdf
    expire_in: 30 days

complex-example:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - examples/complex_example.py
        - examples/config.toml
        - scripts/build_complex_report.py
        - src/catsy/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - uv sync --group dev --locked
    - rm -rf runs/complex_circuit
    - uv run python examples/complex_example.py
    - test -d runs/complex_circuit/plots
  artifacts:
    when: always
    expose_as: "Complex example experiment output"
    paths:
      - runs/complex_circuit/
    expire_in: 30 days

complex-pages:
  extends: .uv-job
  stage: deploy
  needs:
    - job: complex-example
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - rm -rf _site public
    - uv sync --group dev --locked
    - uv run python scripts/build_complex_report.py
    # The report is deployed as a one-segment GitLab Pages parallel deployment,
    # so its link back to the project root needs one .. rather than ../../.
    - sed -i 's|href="../../"|href="../"|g' _site/index.html
    - sed -i "s|https://github.com/raiyiz/catsy/commit/${CI_COMMIT_SHA}|${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}|g" _site/index.html
    - sed -i "s|https://github.com/raiyiz/catsy/actions|${CI_PIPELINE_URL}|g" _site/index.html
    - cp -a _site public
  pages:
    path_prefix: "complex-${CI_COMMIT_SHORT_SHA}"
    expire_in: never
  environment:
    name: "complex-report/${CI_COMMIT_SHORT_SHA}"

pages:
  stage: deploy
  needs:
    - job: pytest
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -f coverage/html/index.html
    - rm -rf public
    - mv coverage/html public
  artifacts:
    paths:
      - public
    expire_in: 30 days
