# Avoid running the pipeline twice for the same commit (once as a branch
# pipeline, once as a merge-request pipeline).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - test
  - docs
  - deploy

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
    # matplotlib auto-detects a headless backend in this environment anyway
    # (no DISPLAY), but pinning it explicitly means `pytest --plot` below
    # doesn't depend on that auto-detection continuing to work on whatever
    # runner image this job happens to execute on.
    MPLBACKEND: "Agg"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  interruptible: true

pytest:
  extends: .uv-job
  stage: test
  # Skip the whole test job when a change only touches docs/CI files that
  # can't affect it -- keeps unrelated MRs (README, typst sources) fast.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - mkdir -p coverage
    # --plot runs the @pytest.mark.visual tests too (skipped by default).
    # Several of them exercise real, non-plotting code paths (e.g.
    # OpticalSetup.inline_squeezer) that would otherwise never show up in
    # the coverage report at all, just because the only test that calls
    # them also happens to end with a plt.show(). matplotlib is headless
    # here (see MPLBACKEND above), so plt.show() is a no-op, not a block.
    - uv run pytest --plot --junitxml=pytest-results.xml --cov=src/catsy --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/html
  artifacts:
    when: always
    # Gives every pipeline -- not just the default branch -- a direct link
    # to its own HTML coverage report in the job/MR view, independent of
    # whether GitLab Pages is deploying correctly.
    expose_as: "HTML coverage report"
    reports:
      junit: pytest-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/coverage.xml
      - coverage/html/
    expire_in: 1 week
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'

ruff:
  extends: .uv-job
  stage: test
  # Same change-based skip as the pytest job above.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - uv run ruff check . --output-format=gitlab --output-file=gl-code-quality-report.json
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week

mypy:
  extends: .uv-job
  stage: test
  # Same stage as pytest/ruff: mypy doesn't depend on either of their
  # results, so running it as a separate later stage only added latency.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/uv/
    - key: mypy-cache
      paths:
        - .mypy_cache/
  script:
    - uv sync --group dev --locked
    - uv run mypy

# Checks every #src-link(..., line: N) in docs/*.typ and every
# [`Symbol`](path#L123) link in README.md against the actual source: the
# path must exist, the line must be in range, and it must declare the
# exact class/function the link's label names. Catches doc links going
# stale after a refactor moves code around -- see scripts/check_doc_links.py
# for exactly what is and isn't checked. No project dependencies needed
# (stdlib only), so this runs in a bare Python image rather than the uv one.
docs-links:
  stage: test
  image: python:3.13-slim
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - README.md
        - src/**/*
        - scripts/check_doc_links.py
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 scripts/check_doc_links.py

# Compiles the architectural-specs PDF from docs/book.typ. Manual/on-demand
# only (press "Run" in the pipeline view or MR widget) -- it doesn't gate
# merges and shouldn't run on every push. `expose_as` surfaces a direct link
# to the built PDF on the MR widget once it has been triggered; see the
# README for a standing link to the latest build on the default branch.
# `repo-url`/`commit-sha` are passed through so the PDF's source-code links
# (docs/links.typ) point at the exact commit this build was compiled from,
# rather than going stale as the default branch moves on.
typst:
  stage: docs
  image:
    name: ghcr.io/typst/typst:latest
    entrypoint: [""]
  allow_failure: true
  script:
    - apk add --no-cache ttf-liberation ttf-dejavu
    - typst compile
      --input repo-url="${CI_PROJECT_URL}"
      --input commit-sha="${CI_COMMIT_SHA}"
      docs/book.typ architectural_specs.pdf
  artifacts:
    expose_as: "Architectural specs PDF"
    paths:
      - architectural_specs.pdf
    expire_in: 30 days

# Publish the latest default-branch HTML coverage report via GitLab Pages.
# The pytest job already generates coverage/html/; this job republishes that
# directory at the project Pages URL. The job is deliberately named `pages`
# and uses the classic `public/` artifact convention (rather than the
# `pages: publish:` keyword under a custom job name, which needs GitLab
# >=17.6 and no-ops silently on older instances) so this works regardless
# of the GitLab version this pipeline runs on.
pages:
  stage: deploy
  needs:
    - job: pytest
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -f coverage/html/index.html
    - rm -rf public
    - mv coverage/html public
  artifacts:
    paths:
      - public
    expire_in: 30 days
