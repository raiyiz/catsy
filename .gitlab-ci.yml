# Avoid running the pipeline twice for the same commit (once as a branch
# pipeline, once as a merge-request pipeline).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "exilas" && $CI_OPEN_MERGE_REQUESTS == null'

stages:
  - test
  - docs
  - deploy

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
    MPLBACKEND: "Agg"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  interruptible: true

pytest:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - mkdir -p coverage
    # --plot runs the @pytest.mark.visualize tests too. matplotlib is
    # headless here (see MPLBACKEND above), so visualization tests render
    # without opening interactive windows.
    - uv run pytest --plot --timings --junitxml=pytest-results.xml --cov=src/catsy --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/html
  artifacts:
    when: always
    expose_as: "HTML coverage report"
    reports:
      junit: pytest-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/coverage.xml
      - coverage/html/
    expire_in: 1 week
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'

ruff:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev --locked
    - uv run ruff check . --output-format=gitlab --output-file=gl-code-quality-report.json
    - uv run ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 1 week

mypy:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/uv/
    - key: mypy-cache
      paths:
        - .mypy_cache/
  script:
    - uv sync --group dev --locked
    - uv run mypy

docs-links:
  stage: test
  image: python:3.13-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - README.md
        - src/**/*
        - scripts/check_doc_links.py
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
        - README.md
        - src/**/*
        - scripts/check_doc_links.py
  script:
    - python3 scripts/check_doc_links.py

typst:
  stage: docs
  image:
    name: ghcr.io/typst/typst:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*
  script:
    - apk add --no-cache ttf-liberation ttf-dejavu
    - typst compile
      --input repo-url="${CI_PROJECT_URL}"
      --input commit-sha="${CI_COMMIT_SHA}"
      docs/book.typ architectural_specs.pdf
  artifacts:
    expose_as: "Architectural specs PDF"
    paths:
      - architectural_specs.pdf
    expire_in: 30 days

complex-example:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - examples/complex_example.py
        - examples/config.toml
        - scripts/build_complex_report.py
        - src/catsy/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - uv sync --group dev --locked
    - rm -rf runs/complex_circuit
    - uv run python examples/complex_example.py
    - test -d runs/complex_circuit/plots
  artifacts:
    when: always
    expose_as: "Complex example experiment output"
    paths:
      - runs/complex_circuit/
    expire_in: 30 days

complex-circuit-example:
  extends: .uv-job
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - examples/complex_circuit.py
        - examples/config_circuit.toml
        - scripts/build_complex_report.py
        - src/catsy/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - uv sync --group dev --locked
    - rm -rf runs/complex_circuit_basic
    - uv run python examples/complex_circuit.py
    - test -d runs/complex_circuit_basic
  artifacts:
    when: always
    expose_as: "Complex circuit experiment output"
    paths:
      - runs/complex_circuit_basic/
    expire_in: 30 days

# Deploys one persistent GitLab Pages site: the example-run archive at the
# root, and the pytest coverage report nested under /coverage/. The generated
# history is kept in a custom Git ref rather than refs/heads, so GitLab does
# not treat it as a developer branch or offer the usual merge-request prompt.
# The ref is migrated automatically from the old `pages-history` branch on its
# first deployment after this change.
#
# The CI job token must be allowed to push to the repository (Settings > CI/CD
# > Job token permissions, or "Allow the job token to push to this repository").
pages:
  extends: .uv-job
  stage: deploy
  needs:
    - job: pytest
      artifacts: true
    - job: complex-example
      artifacts: true
    - job: complex-circuit-example
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  variables:
    REPORT_COMMIT: "${CI_COMMIT_SHA}"
    REPORT_REF: "${CI_COMMIT_REF_NAME}"
    REPORT_RUN_ID: "${CI_PIPELINE_ID}"
    REPORT_COMMIT_URL: "${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
    REPORT_CI_URL: "${CI_PIPELINE_URL}"
    PAGES_HISTORY_REF: "refs/catsy/pages-history"
    PAGES_HISTORY_BRANCH: "pages-history"
  script:
    - test -f coverage/html/index.html
    - uv sync --group dev --locked
    - |
      if git ls-remote --exit-code origin "${PAGES_HISTORY_REF}" >/dev/null 2>&1; then
        git fetch origin "${PAGES_HISTORY_REF}"
        git worktree add _site FETCH_HEAD
      elif git ls-remote --exit-code origin "refs/heads/${PAGES_HISTORY_BRANCH}" >/dev/null 2>&1; then
        # One-time migration from the old visible branch to the custom ref.
        git fetch origin "refs/heads/${PAGES_HISTORY_BRANCH}"
        git worktree add _site FETCH_HEAD
      else
        # Older Git versions do not support `git worktree add --orphan`.
        # Create a detached worktree first, then create the orphan branch
        # inside it using the long-supported `git checkout --orphan` form.
        git worktree add --detach _site HEAD
        git -C _site checkout --orphan pages-history
        git -C _site rm -rf .
      fi
    - uv run python scripts/build_complex_report.py
    - rm -rf _site/coverage
    - cp -r coverage/html _site/coverage
    - |
      git -C _site config user.name "gitlab-ci"
      git -C _site config user.email "gitlab-ci@${CI_SERVER_HOST}"
      git -C _site add --all
      git -C _site commit -m "ci: publish pages for ${CI_COMMIT_SHA}"
      git -C _site push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:"${PAGES_HISTORY_REF}"
      if git ls-remote --exit-code origin "refs/heads/${PAGES_HISTORY_BRANCH}" >/dev/null 2>&1; then
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" ":refs/heads/${PAGES_HISTORY_BRANCH}"
      fi
    - rm -rf public
    - cp -a _site public
  artifacts:
    paths:
      - public
    expire_in: 30 days
