# Avoid running the pipeline twice for the same commit (once as a branch
# pipeline, once as a merge-request pipeline).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - test
  - docs
  - deploy

.uv-job:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  interruptible: true

pytest:
  extends: .uv-job
  stage: test
  # Skip the whole test job when a change only touches docs/CI files that
  # can't affect it -- keeps unrelated MRs (README, typst sources) fast.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev
    - mkdir -p coverage
    - uv run pytest --junitxml=pytest-results.xml --cov=src/catsy --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=html:coverage/html
  artifacts:
    when: always
    reports:
      junit: pytest-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - coverage/coverage.xml
      - coverage/html/
    expire_in: 1 week
  coverage: '/TOTAL.*? (100(?:\.0+)?%|[1-9]?\d(?:\.\d+)?%)$/'

ruff:
  extends: .uv-job
  stage: test
  # Same change-based skip as the pytest job above.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - uv sync --group dev
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  extends: .uv-job
  stage: test
  # Same stage as pytest/ruff: mypy doesn't depend on either of their
  # results, so running it as a separate later stage only added latency.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - src/**/*
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .cache/uv/
    - key: mypy-cache
      paths:
        - .mypy_cache/
  script:
    - uv sync --group dev
    - uv run mypy

# Compiles the architectural-specs PDF from docs/book.typ. Manual/on-demand
# only (press "Run" in the pipeline view or MR widget) -- it doesn't gate
# merges and shouldn't run on every push. `expose_as` surfaces a direct link
# to the built PDF on the MR widget once it has been triggered; see the
# README for a standing link to the latest build on the default branch.
# `repo-url`/`commit-sha` are passed through so the PDF's source-code links
# (docs/links.typ) point at the exact commit this build was compiled from,
# rather than going stale as the default branch moves on.
typst:
  stage: docs
  image:
    name: ghcr.io/typst/typst:latest
    entrypoint: [""]
  rules:
    - when: manual
  allow_failure: true
  script:
    - apk add --no-cache ttf-liberation ttf-dejavu
    - typst compile
      --input repo-url="${CI_PROJECT_URL}"
      --input commit-sha="${CI_COMMIT_SHA}"
      docs/book.typ architectural_specs.pdf
  artifacts:
    expose_as: "Architectural specs PDF"
    paths:
      - architectural_specs.pdf
    expire_in: 30 days

# Publish the latest default-branch HTML coverage report via GitLab Pages.
# The pytest job already generates coverage/html/; this job publishes that
# directory at the project Pages URL.
coverage-pages:
  stage: deploy
  needs:
    - job: pytest
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -f coverage/html/index.html
  pages:
    publish: coverage/html
